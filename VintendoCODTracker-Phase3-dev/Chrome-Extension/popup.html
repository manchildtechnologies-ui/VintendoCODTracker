<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vintendo Squad AI</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><div class="brand-mark">V</div><div><div class="eyebrow">VINTENDO / SQUAD NIGHT</div><h1>Squad AI</h1></div><button id="refresh" class="icon" title="Refresh queue" aria-label="Refresh">↻</button></header>
  <section class="connection"><span id="dot" class="dot"></span><span id="connection">Checking Tracker…</span><span id="queueCount" class="count">—</span></section>
  <label class="field-label" for="jobs">MATCH QUEUE</label><select id="jobs"><option value="">Connect to Tracker</option></select>
  <main id="job" class="card empty">Pair the extension with Vintendo COD Tracker in Options.</main>
  <div id="promptBlock" class="prompt-block hidden"><div class="row"><span class="field-label">GENERATED PROMPT · 16:9</span><button id="copy" class="text-button">Copy</button></div><pre id="prompt"></pre></div>
  <div class="actions">
    <button id="openMeta" class="primary" disabled>Open Meta AI</button>
    <button id="prepare" disabled>Prepare Reference Photos</button>
    <button id="submitted" disabled>Mark Generation Submitted</button>
    <button id="import" disabled>Import Completed Image</button>
    <div id="selectedFile" class="muted small">No completed image selected</div>
    <button id="send" class="primary" disabled>Send Completed Job to Tracker</button>
    <div class="split"><button id="retry" disabled>Retry</button><button id="cancel" class="danger" disabled>Cancel Job</button></div>
  </div>
  <footer><span id="downloadInfo">No completed download detected</span><button id="options" class="text-button">Options</button></footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body></html>
