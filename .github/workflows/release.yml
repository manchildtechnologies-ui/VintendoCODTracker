name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: VintendoCODTracker-Phase3-dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: VintendoCODTracker-Phase3-dev/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Version tag must match version.py
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = (Select-String -Pattern "APP_VERSION\s*=\s*'([^']+)'" -Path version.py).Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "Tag v$tag does not match version.py APP_VERSION $ver" }

      - name: Build exe
        run: python build.py

      - name: Verify packaged build
        shell: pwsh
        run: |
          $env:VINTENDO_DATA_DIR = "$env:RUNNER_TEMP/verify-data"
          $env:VINTENDO_NO_AUTO_START = "1"
          ./VintendoCODTracker.exe --verify-build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VintendoCODTracker-Phase3-dev/VintendoCODTracker.exe
          generate_release_notes: true
